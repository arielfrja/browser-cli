<!DOCTYPE html>
<html><head><title>3D Debug Test</title><style>
body{margin:0;overflow:hidden;font-family:sans-serif}
#info{position:absolute;top:10px;left:10px;color:#fff;background:rgba(0,0,0,.7);padding:10px;border-radius:4px;z-index:10;font-size:14px}
#controls{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:10px}
button{padding:8px 16px;border:none;border-radius:4px;cursor:pointer;font-size:14px}
#spUp{background:#4CAF50;color:#fff}#spDn{background:#f44336;color:#fff}#toggle{background:#2196F3;color:#fff}
</style></head><body>
<div id="info"><div>FPS: <span id="fps">0</span></div><div>Speed: <span id="spd">1.0</span>x</div><div id="status">running</div></div>
<div id="controls"><button id="spUp">Speed+</button><button id="spDn">Speed-</button><button id="toggle">Pause/Resume</button></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.166.0/build/three.module.js"}}</script>
<script type="module">
import*as THREE from'three'
const S=new THREE.Scene;S.background=new THREE.Color(0x1a1a2e)
const C=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1e3);C.position.z=5
const R=new THREE.WebGLRenderer({antialias:!0});R.setSize(innerWidth,innerHeight);R.setPixelRatio(devicePixelRatio)
document.body.appendChild(R.domElement)
const geo=new THREE.BoxGeometry,mat=new THREE.MeshStandardMaterial({color:0xe94560}),cube=new THREE.Mesh(geo,mat);S.add(cube)
cube.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color:0xffffff})))
S.add(new THREE.AmbientLight(0x404040))
const dl=new THREE.DirectionalLight(0xffffff,1);dl.position.set(5,10,7);S.add(dl)
let spd=1,run=!0,fc=0,t=performance.now()
function changeSpeed(d){spd=Math.max(.1,Math.min(5,spd+d));document.getElementById('spd').textContent=spd.toFixed(1);console.log('speed:',spd)}
function toggleRun(){run=!run;document.getElementById('status').textContent=run?'running':'paused';console.log('run:',run)}
;(function anim(){requestAnimationFrame(anim)
if(run){cube.rotation.x+=.01*spd;cube.rotation.y+=.02*spd}
R.render(S,C);fc++;const n=performance.now();if(n-t>=1e3){document.getElementById('fps').textContent=fc;fc=0;t=n}
})()
document.getElementById('spUp').onclick=()=>changeSpeed(.5)
document.getElementById('spDn').onclick=()=>changeSpeed(-.5)
document.getElementById('toggle').onclick=toggleRun
onresize=()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)}
console.log('scene ready')
</script></body></html>
